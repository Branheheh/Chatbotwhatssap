version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: conred_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: conred
      POSTGRES_PASSWORD: conred_password
      POSTGRES_DB: conred_bot
    ports:
      - "5432:5432"
    volumes:
      - conred_bot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conred -d conred_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: conred_bot_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://conred:conred_password@db:5432/conred_bot
    ports:
      - "3000:3000"

volumes:
  conred_bot_pgdata:
